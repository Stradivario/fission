name: Release Charts

on:
  push:
    branches:
      - release/custom-v3.0
    paths:
      - 'charts/**'
  workflow_dispatch:


jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # chart-releaser publishes the charts changed since the latest tag. An
      # image tag (vX.Y.Z-watch-all-namespaces) pushed with the release commit
      # would hide the bump, so only chart tags count.
      - name: Keep only chart tags
        run: git tag -l | grep -v '^fission-all-' | xargs -r git tag -d > /dev/null

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
