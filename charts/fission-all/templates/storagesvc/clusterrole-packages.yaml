{{- if .Values.storagesvc.archivePruner.enabled }}
# The archive pruner keeps every archive a Package references in ANY
# namespace (pkg/storagesvc/archivePruner.go), so it needs to list packages
# cluster-wide - read-only. Without it the listing fails and the pruner skips
# every cycle (it never guesses).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-storagesvc-packages-reader
rules:
  - apiGroups: ["fission.io"]
    resources: ["packages"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-storagesvc-packages-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-storagesvc-packages-reader
subjects:
  - kind: ServiceAccount
    name: fission-storagesvc
    namespace: {{ .Release.Namespace }}
{{- end }}
